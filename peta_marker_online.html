const map = L.map('map').setView([-5.0, 105.5], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const layer = L.layerGroup().addTo(map);
const markers = [];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);

function render(list, fit=true) {
  layer.clearLayers(); markers.length=0;
  list.forEach(p => {
    const m = L.marker([p.latitude,p.longitude]).bindPopup(
      '<b>'+esc(p.name)+'</b><br><div style="margin-top:6px">'+esc(p.description)+'</div>' +
      '<br><a target="_blank" href="https://www.google.com/maps/search/?api=1&query='+p.latitude+','+p.longitude+'">Buka Google Maps</a>'
    );
    m.addTo(layer); markers.push(m);
  });
  document.getElementById('count').textContent = list.length + ' marker';
  if (fit && list.length) {
    const b = L.latLngBounds(list.map(p => [p.latitude,p.longitude]));
    map.fitBounds(b, {padding:[30,30]});
  }
}
render(places);

document.getElementById('search').addEventListener('input', e => {
  const q=e.target.value.trim().toLowerCase();
  const list=q ? places.filter(p => (p.name+' '+p.description).toLowerCase().includes(q)) : places;
  render(list, list.length > 0);
});
