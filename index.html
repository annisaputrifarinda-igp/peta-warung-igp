<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peta Warung IGP - Modern</title>
<meta name="version" content="2026-08-27-modern-blue-green-v1">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

<style>
html,body,#map{height:100%;margin:0}
body{font-family:Arial,sans-serif;overflow:hidden}

/* =========================
   PANEL PENCARIAN
   Saran dan tombol berada
   dalam satu alur vertikal.
   Tombol TIDAK akan menutupi saran.
   ========================= */
#topPanel{
  position:absolute;
  z-index:2000;
  top:14px;
  left:58px;
  width:min(650px,calc(100vw - 85px));
}

#searchBox{width:100%}

#search{
  display:block;
  width:100%;
  box-sizing:border-box;
  padding:12px 14px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
  outline:none;
  background:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.18);
}

#search:focus{
  border-color:#4285f4;
  box-shadow:0 2px 10px rgba(66,133,244,.25);
}

/* Saran menjadi bagian dari panel, bukan absolute.
   Karena itu tombol otomatis turun ketika saran muncul. */
#suggestions{
  display:none;
  width:100%;
  max-height:300px;
  overflow-y:auto;
  overflow-x:hidden;
  box-sizing:border-box;
  background:#fff;
  border:1px solid #ddd;
  border-top:0;
  border-radius:0 0 8px 8px;
  box-shadow:0 3px 12px rgba(0,0,0,.18);
}

.suggestion{
  padding:10px 12px;
  cursor:pointer;
  border-bottom:1px solid #eee;
}

.suggestion:last-child{border-bottom:0}

.suggestion:hover,
.suggestion.active{
  background:#f0f6ff;
}

.suggestion b{
  display:block;
  font-size:15px;
}

.suggestion small{
  display:block;
  color:#666;
  margin-top:3px;
}

/* Bilah fitur selalu berada DI BAWAH saran */
#controls{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  width:100%;
  margin-top:9px;
}

button,select{
  border:0;
  border-radius:7px;
  background:#fff;
  padding:9px 11px;
  box-shadow:0 2px 8px rgba(0,0,0,.20);
  cursor:pointer;
  font-size:14px;
}

button:hover,select:hover{background:#f3f3f3}
button:active{transform:translateY(1px)}

#kabupaten{
  max-width:225px;
}

/* Status */
#status{
  position:absolute;
  z-index:1000;
  left:58px;
  bottom:14px;
  padding:8px 11px;
  border-radius:7px;
  background:rgba(255,255,255,.95);
  box-shadow:0 2px 8px rgba(0,0,0,.20);
  font-size:13px;
}

/* Panel warung terdekat */
#nearbyPanel{
  position:absolute;
  z-index:2000;
  right:12px;
  top:12px;
  width:min(320px,calc(100% - 24px));
  max-height:55vh;
  overflow:auto;
  display:none;
  background:#fff;
  border-radius:9px;
  box-shadow:0 3px 15px rgba(0,0,0,.25);
}

#nearbyPanel h3{
  margin:0;
  padding:12px;
  border-bottom:1px solid #ddd;
}

.nearbyItem{
  padding:10px 12px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}

.nearbyItem:hover{background:#f5f5f5}

.nearbyItem small{
  display:block;
  color:#666;
  margin-top:3px;
}

.closeNearby{
  float:right;
  background:none;
  box-shadow:none;
  padding:0;
  font-size:20px;
}

/* Legenda */
.legend{
  line-height:18px;
  color:#333;
  background:#fff;
  padding:8px 10px;
  border-radius:7px;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
  max-height:220px;
  overflow:auto;
  max-width:220px;
}

.legend i{
  width:14px;
  height:14px;
  float:left;
  margin-right:7px;
  margin-top:2px;
  border-radius:50%;
}

/* Marker hasil pencarian */
.search-highlight{
  width:34px;
  height:34px;
  border-radius:50%;
  background:#ff9800;
  border:4px solid #fff;
  box-shadow:0 0 0 5px rgba(255,152,0,.30),0 3px 10px rgba(0,0,0,.35);
  animation:searchPulse 1.2s infinite;
}

@keyframes searchPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.12)}
}

/* =========================
   LABEL NAMA WARUNG DI PETA
   ========================= */
.warung-label-icon{
  background:transparent;
  border:0;
}
.warung-label-wrap{
  display:flex;
  align-items:center;
  gap:5px;
  white-space:nowrap;
  transform:translate(-2px,-2px);
  pointer-events:auto;
}
.warung-label-pin{
  width:20px;
  height:20px;
  flex:0 0 20px;
  border-radius:50% 50% 50% 0;
  transform:rotate(-45deg);
  border:2px solid #fff;
  box-shadow:0 2px 5px rgba(0,0,0,.35);
  position:relative;
}
.warung-label-pin::after{
  content:"";
  position:absolute;
  width:6px;
  height:6px;
  border-radius:50%;
  background:#fff;
  left:5px;
  top:5px;
}
.warung-label-text{
  max-width:210px;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:13px;
  line-height:16px;
  font-weight:700;
  color:#2b8a00;
  text-shadow:
    -1px -1px 0 #fff,
     1px -1px 0 #fff,
    -1px  1px 0 #fff,
     1px  1px 0 #fff,
     0 0 3px #fff;
  cursor:pointer;
}
.warung-label-icon.selected .warung-label-text{
  color:#d35400;
  font-size:14px;
}
@media(max-width:700px){
  .warung-label-text{max-width:150px;font-size:12px;line-height:14px}
}

@media(max-width:700px){
  #topPanel{
    left:52px;
    width:calc(100vw - 66px);
  }

  #controls{
    gap:6px;
  }

  #controls button,
  #controls select{
    font-size:13px;
    padding:8px 9px;
  }

  #kabupaten{
    max-width:none;
    flex:1 1 100%;
  }

  #nearbyPanel{
    top:auto;
    bottom:50px;
  }
}

@media(max-width:430px){
  #topPanel{
    top:10px;
    left:48px;
    width:calc(100vw - 58px);
  }

  #search{
    font-size:14px;
    padding:10px 11px;
  }

  #controls button{
    flex:1 1 auto;
  }
}

  color:#2563eb !important;
}

@media(max-width:700px){

    width:calc(100vw - 62px);
  }

<body>
<div id="map"></div>

<!-- Semua kontrol berada dalam satu panel -->
<div id="topPanel">
  <div id="searchBox">
    <input
      id="search"
      autocomplete="off"
      placeholder="Cari warung atau wilayah (Kabupaten/Kota/Kecamatan)..."
      aria-label="Cari warung"
    >
    <div id="suggestions"></div>
  </div>

  <div id="controls">
    <select id="kabupaten" aria-label="Filter Kabupaten atau Kota">
      <option value="">🏘️ Semua Kabupaten / Kota</option>
    </select>

    <button id="locate" type="button">📍 Lokasi Saya</button>
    <button id="nearby" type="button">🔎 Warung Terdekat</button>
    <button id="refresh" type="button">↻ Muat ulang</button>
    <button id="satellite" type="button">🛰️ Satelit</button>
  </div>
</div>

<div id="status">Memuat data...</div>

<div id="nearbyPanel">
  <h3>
    🔎 Warung Terdekat
    <button class="closeNearby" onclick="closeNearby()" aria-label="Tutup">×</button>
  </h3>
  <div id="nearbyList"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script>
/* =========================
   DATA GOOGLE SHEETS
   ========================= */
const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQP1l3fVYi1dWu0g2UkLdpwcqosl7SUMGqDhibVGx6caqQwHKWWEx-ldWfLxrewHWlSiIm46Bv2uHIb/pub?output=csv";

/* =========================
   PETA
   ========================= */
const map = L.map("map", {
  preferCanvas:true,
  zoomControl:true,
  zoomAnimation:true,
  fadeAnimation:true,
  markerZoomAnimation:true
}).setView([-4.8,105.4],9);

/* =====================================================
   SISTEM PETA STABIL

   Mode peta jalan memakai satu layer aktif pada satu waktu:
   1. Esri World Street Map sebagai utama
   2. OpenStreetMap sebagai cadangan

   Mode satelit memakai Esri World Imagery. Jika beberapa tile
   satelit gagal berturut-turut, peta otomatis kembali ke jalan agar
   layar tidak menetap abu-abu.

   Tidak ada redraw loop dan tidak ada cache-busting pada URL tile.
   ===================================================== */
const streetEsri = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
  {
    maxZoom:19,
    maxNativeZoom:19,
    updateWhenIdle:true,
    updateWhenZooming:false,
    keepBuffer:3,
    attribution:"Tiles &copy; Esri"
  }
);

const streetOSM = L.tileLayer(
  "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom:19,
    maxNativeZoom:19,
    updateWhenIdle:true,
    updateWhenZooming:false,
    keepBuffer:3,
    attribution:"&copy; OpenStreetMap contributors"
  }
);

const satellite = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  {
    maxZoom:19,
    maxNativeZoom:19,
    updateWhenIdle:true,
    updateWhenZooming:false,
    keepBuffer:3,
    attribution:"Tiles &copy; Esri"
  }
);

const streetLayers=[streetEsri,streetOSM];
let activeStreet=streetEsri;
let streetIndex=0;
let satelliteOn=false;
let streetErrorCount=0;
let satelliteErrorCount=0;
let streetLoadCount=0;
let satelliteLoadCount=0;
let streetSwitchTimer=null;
let satelliteSwitchTimer=null;
let mapLayerSwitching=false;

function removeStreetLayers(){
  streetLayers.forEach(layerObj=>{
    if(map.hasLayer(layerObj)) map.removeLayer(layerObj);
  });
}

function setActiveStreet(index,{announce=false}={}){
  const safeIndex=((index%streetLayers.length)+streetLayers.length)%streetLayers.length;
  const next=streetLayers[safeIndex];

  mapLayerSwitching=true;
  removeStreetLayers();
  activeStreet=next;
  streetIndex=safeIndex;
  activeStreet.addTo(map);
  activeStreet.bringToBack();
  streetErrorCount=0;
  streetLoadCount=0;

  requestAnimationFrame(()=>{
    map.invalidateSize({pan:false});
    mapLayerSwitching=false;
  });

  if(announce){
    status.textContent=
      streetIndex===0
        ? "Peta jalan memakai server Esri."
        : "Peta jalan dialihkan ke OpenStreetMap.";
  }
}

function showStreet({announce=false}={}){
  satelliteOn=false;
  clearTimeout(satelliteSwitchTimer);

  if(map.hasLayer(satellite)) map.removeLayer(satellite);
  if(!map.hasLayer(activeStreet)) activeStreet.addTo(map);
  activeStreet.bringToBack();

  document.getElementById("satellite").textContent="🛰️ Satelit";
  requestAnimationFrame(()=>map.invalidateSize({pan:false}));

  if(announce) status.textContent="Peta jalan ditampilkan.";
}

function showSatellite(){
  clearTimeout(streetSwitchTimer);
  satelliteOn=true;
  satelliteErrorCount=0;
  satelliteLoadCount=0;

  removeStreetLayers();
  if(!map.hasLayer(satellite)) satellite.addTo(map);
  satellite.bringToBack();

  document.getElementById("satellite").textContent="🗺️ Peta Jalan";
  requestAnimationFrame(()=>map.invalidateSize({pan:false}));
}

function scheduleStreetFallback(){
  if(satelliteOn || mapLayerSwitching || streetErrorCount<5) return;
  if(streetSwitchTimer) return;

  streetSwitchTimer=setTimeout(()=>{
    streetSwitchTimer=null;
    if(satelliteOn || mapLayerSwitching || streetErrorCount<5) return;

    if(streetLayers.length>1){
      const nextIndex=(streetIndex+1)%streetLayers.length;
      setActiveStreet(nextIndex,{announce:true});
    }
  },900);
}

streetLayers.forEach(layerObj=>{
  layerObj.on("tileload",()=>{
    if(layerObj===activeStreet && !satelliteOn){
      streetLoadCount++;
      /* Jika tile mulai berhasil, jangan langsung pindah hanya karena
         beberapa kegagalan lama saat proses zoom. */
      if(streetLoadCount>=2) streetErrorCount=0;
    }
  });

  layerObj.on("tileerror",()=>{
    if(layerObj!==activeStreet || satelliteOn || mapLayerSwitching) return;
    streetErrorCount++;
    scheduleStreetFallback();
  });
});

satellite.on("tileload",()=>{
  if(!satelliteOn) return;
  satelliteLoadCount++;
  if(satelliteLoadCount>=2) satelliteErrorCount=0;
});

satellite.on("tileerror",()=>{
  if(!satelliteOn) return;
  satelliteErrorCount++;

  if(satelliteErrorCount>=5 && !satelliteSwitchTimer){
    satelliteSwitchTimer=setTimeout(()=>{
      satelliteSwitchTimer=null;
      if(satelliteOn && satelliteErrorCount>=5){
        showStreet({announce:false});
        status.textContent="Satelit tidak dapat dimuat. Peta jalan ditampilkan kembali.";
      }
    },900);
  }
});

/* Mulai dengan peta jalan utama. */
setActiveStreet(0);

   CLUSTER
   ========================= */
const layer = L.markerClusterGroup({
  chunkedLoading:true,
  chunkInterval:80,
  chunkDelay:20,
  maxClusterRadius:55,
  disableClusteringAtZoom:16,
  spiderfyOnMaxZoom:true,
  showCoverageOnHover:false,
  animate:true,
  animateAddingMarkers:false
});

map.addLayer(layer);

/* Layer khusus marker hasil pencarian */
const selectedLayer = L.layerGroup().addTo(map);

   mulai zoom 14 label nama ditampilkan seperti peta warung pada contoh. */

const LABEL_ZOOM = 14;
let labelsVisible = false;

/* Perbaikan zoom/resize */
map.on("zoomend",()=>{

map.on("moveend",()=>{

   VARIABEL
   ========================= */
let allRows = [];
let visibleRows = [];
let userMarker = null;
let userCircle = null;
let selectedMarker = null;
let colors = {};
/* satelliteOn dideklarasikan pada sistem peta baru di atas. */

/* =========================
   UTILITAS
   ========================= */
function esc(v){
  return String(v ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

function normalize(s){
  return String(s ?? "").trim().toLowerCase();
}

/* Parser CSV sederhana tetapi aman untuk koma dalam tanda kutip */
function parseCSV(text){
  const rows=[];
  let row=[],cell="",quoted=false;

  for(let i=0;i<text.length;i++){
    const c=text[i];
    const n=text[i+1];

    if(quoted){
      if(c === '"' && n === '"'){
        cell+='"';
        i++;
      }else if(c === '"'){
        quoted=false;
      }else{
        cell+=c;
      }
    }else{
      if(c === '"'){
        quoted=true;
      }else if(c === ','){
        row.push(cell);
        cell="";
      }else if(c === '\n'){
        row.push(cell);
        rows.push(row);
        row=[];
        cell="";
      }else if(c !== '\r'){
        cell+=c;
      }
    }
  }

  row.push(cell);
  if(row.some(x=>x.trim()!=="")) rows.push(row);

  if(!rows.length) return [];

  const headers=rows[0].map(x=>normalize(x));

  return rows.slice(1).map(r=>{
    const o={};

    headers.forEach((h,i)=>{
      o[h]=(r[i] ?? "").trim();
    });

    /* Dukungan nama kolom Google Sheets */
    const kab =
      o["kabupaten / kota"] ||
      o["kabupaten/kota"] ||
      o["kabupaten"] ||
      o["kota"] ||
      "";

    if(kab) o.kabupaten=kab;

    const kec=o["kecamatan"] || "";
    if(kec) o.kecamatan=kec;

    return o;
  });
}

function num(v){
  if(v===null || v===undefined || v==="") return NaN;

  let s=String(v).trim().replace(/\s/g,"");

  /* Menangani format data lama seperti -49,953,786 */
  if((s.match(/,/g)||[]).length>1){
    const neg=s.startsWith("-") ? -1 : 1;
    s=s.replace(/-/g,"").replace(/,/g,"");

    if(s.length>1){
      s=s.slice(0,1)+"."+s.slice(1);
    }

    return neg*parseFloat(s);
  }

  if(s.includes(",") && !s.includes(".")){
    s=s.replace(",",".");
  }

  return parseFloat(s);
}

function getCoord(r){
  let lat=num(r.latitude_benar);
  let lng=num(r.longitude_benar);

  if(!Number.isFinite(lat)) lat=num(r.latitude);
  if(!Number.isFinite(lng)) lng=num(r.longitude);

  return {lat,lng};
}

/* =========================
   WARNA KABUPATEN
   ========================= */
function colorFor(k){
  const key=k || "Tanpa Kabupaten";

  if(!colors[key]){
    const hue=(Object.keys(colors).length*47)%360;
    colors[key]=`hsl(${hue},70%,45%)`;
  }

  return colors[key];
}

function makeIcon(color){
  return L.divIcon({
    className:"",
    html:`<div style="
      width:22px;
      height:22px;
      border-radius:50% 50% 50% 0;
      background:${color};
      transform:rotate(-45deg);
      border:2px solid white;
      box-shadow:0 2px 5px rgba(0,0,0,.35);
      position:relative">
      <div style="
        width:7px;
        height:7px;
        border-radius:50%;
        background:white;
        position:absolute;
        left:7px;
        top:7px">
      </div>
    </div>`,
    iconSize:[26,26],
    iconAnchor:[13,26],
    popupAnchor:[0,-24]
  });
}

function makeLabelIcon(r){
  const {lat,lng}=getCoord(r);
  const kab=r.kabupaten || "";
  const color=colorFor(kab);
  const name=esc(r.name || "Warung");

  return L.divIcon({
    className:"warung-label-icon",
    html:`<div class="warung-label-wrap" title="${name}">
      <div class="warung-label-pin" style="background:${color}"></div>
      <div class="warung-label-text">${name}</div>
    </div>`,
    iconSize:[240,28],
    iconAnchor:[10,14],
    popupAnchor:[0,-18]
  });
}

function renderLabels(){
  labelLayer.clearLayers();
  if(!allRows.length) return;

  const selected=normalize(kabupatenSelect.value);
  const bounds=map.getBounds().pad(0.35);
  const list=allRows.filter(r=>{
    if(selected && normalize(r.kabupaten)!==selected) return false;
    const c=getCoord(r);
    return Number.isFinite(c.lat) && Number.isFinite(c.lng) && bounds.contains([c.lat,c.lng]);
  });

  const markers=[];
  list.forEach(r=>{
    const c=getCoord(r);
    if(!Number.isFinite(c.lat)||!Number.isFinite(c.lng)) return;

    const m=L.marker([c.lat,c.lng],{
      icon:makeLabelIcon(r),
      zIndexOffset:100
    });
    m._row=r;
    m.bindPopup(popupHtml(r),{
      autoPan:true,
      autoPanPaddingTopLeft:[20,180],
      autoPanPaddingBottomRight:[20,40]
    });
    markers.push(m);
  });

  markers.forEach(m=>labelLayer.addLayer(m));
}

function updateMapDisplay(){
  const shouldShow=map.getZoom()>=LABEL_ZOOM;

  if(shouldShow===labelsVisible) return;
  labelsVisible=shouldShow;

  if(labelsVisible){
    if(map.hasLayer(layer)) map.removeLayer(layer);
    renderLabels();
    if(!map.hasLayer(labelLayer)) labelLayer.addTo(map);
  }else{
    if(map.hasLayer(labelLayer)) map.removeLayer(labelLayer);
    if(!map.hasLayer(layer)) layer.addTo(map);
  }
}

function makeSearchIcon(){
  return L.divIcon({
    className:"",
    html:`<div class="search-highlight"></div>`,
    iconSize:[42,42],
    iconAnchor:[21,21],
    popupAnchor:[0,-22]
  });
}

/* =========================
   POPUP
   ========================= */
function popupHtml(r){
  const {lat,lng}=getCoord(r);

  const name=esc(r.name || "Warung");
  const kab=esc(r.kabupaten || "Tidak diisi");
  const desc=esc(r.description || "");

  const maps=
    `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;

  return `
    <div style="min-width:220px;max-width:300px">
      <b style="font-size:16px">${name}</b>

      <div style="margin:6px 0">
        <b>Kabupaten:</b> ${kab}
      </div>

      ${desc ? `<div style="margin-bottom:8px">${desc}</div>` : ""}

      <a href="${maps}"
         target="_blank"
         rel="noopener"
         style="
           display:inline-block;
           background:#1a73e8;
           color:white;
           padding:8px 11px;
           border-radius:6px;
           text-decoration:none">
        🗺️ Lihat di Google Maps
      </a>
    </div>`;
}

/* =========================
   RENDER SEMUA WARUNG
   ========================= */
function render(list,fit=false){
  layer.clearLayers();
  selectedLayer.clearLayers();
  selectedMarker=null;
  visibleRows=list;

  const markers=[];

  list.forEach(r=>{
    const {lat,lng}=getCoord(r);

    if(!Number.isFinite(lat)||!Number.isFinite(lng)) return;

    const kab=r.kabupaten || "";

    const marker=L.marker(
      [lat,lng],
      {icon:makeIcon(colorFor(kab))}
    );

    marker.bindPopup(popupHtml(r));
    marker._row=r;

    markers.push(marker);
  });

  layer.addLayers(markers);

  if(map.getZoom()>=LABEL_ZOOM){
    labelsVisible=true;
    renderLabels();
    if(map.hasLayer(layer)) map.removeLayer(layer);
    if(!map.hasLayer(labelLayer)) labelLayer.addTo(map);
  }else{
    labelsVisible=false;
    if(map.hasLayer(labelLayer)) map.removeLayer(labelLayer);
    if(!map.hasLayer(layer)) layer.addTo(map);
  }

  status.textContent=
    `Menampilkan ${markers.length.toLocaleString("id-ID")} warung`;

  if(fit && markers.length){
    const group=L.featureGroup(markers);
    map.fitBounds(group.getBounds().pad(0.12));
  }
}

/* =========================
   FILTER KABUPATEN
   ========================= */
function populateKabupaten(){
  const vals=[
    ...new Set(
      allRows
        .map(r=>r.kabupaten)
        .filter(Boolean)
    )
  ].sort((a,b)=>a.localeCompare(b,"id"));

  const oldValue=kabupatenSelect.value;

  kabupatenSelect.innerHTML=
    '<option value="">🏘️ Semua Kabupaten / Kota</option>';

  vals.forEach(v=>{
    const o=document.createElement("option");
    o.value=v;
    o.textContent=v;
    kabupatenSelect.appendChild(o);
  });

  if(vals.includes(oldValue)){
    kabupatenSelect.value=oldValue;
  }
}

function applyKabupatenFilter(fit=false){
  const selected=normalize(kabupatenSelect.value);

  const filtered=allRows.filter(r=>{
    return !selected || normalize(r.kabupaten)===selected;
  });

  /* Filter Kabupaten memang menyaring marker */
  render(filtered,fit);
}

/* =========================
   AUTOCOMPLETE
   ========================= */
function getRegionSuggestions(q){
  const groups=[];

  const kabupatenMap=new Map();
  const kecamatanMap=new Map();

  allRows.forEach(r=>{
    const kab=String(r.kabupaten || "").trim();
    const kec=String(r.kecamatan || "").trim();

    if(kab){
      const key=normalize(kab);
      if(!kabupatenMap.has(key)){
        kabupatenMap.set(key,{name:kab,rows:[]});
      }
      kabupatenMap.get(key).rows.push(r);
    }

    if(kec){
      const key=normalize(kec);
      if(!kecamatanMap.has(key)){
        kecamatanMap.set(key,{name:kec,rows:[]});
      }
      kecamatanMap.get(key).rows.push(r);
    }
  });

  kabupatenMap.forEach(v=>{
    if(normalize(v.name).includes(q)){
      groups.push({
        type:"kabupaten",
        name:v.name,
        rows:v.rows
      });
    }
  });

  kecamatanMap.forEach(v=>{
    if(normalize(v.name).includes(q)){
      groups.push({
        type:"kecamatan",
        name:v.name,
        rows:v.rows
      });
    }
  });

  return groups
    .sort((a,b)=>{
      const as=normalize(a.name).startsWith(q) ? 0 : 1;
      const bs=normalize(b.name).startsWith(q) ? 0 : 1;
      if(as!==bs) return as-bs;

      if(a.type!==b.type){
        return a.type==="kabupaten" ? -1 : 1;
      }

      return a.name.localeCompare(b.name,"id");
    })
    .slice(0,8);
}

function showSuggestions(){
  const q=normalize(search.value);

  suggestions.innerHTML="";

  if(!q){
    suggestions.style.display="none";
    return;
  }

  /* =========================
     SARAN WILAYAH
     ========================= */
  const regions=getRegionSuggestions(q);

  if(regions.length){
    const title=document.createElement("div");
    title.className="suggestion-group-title";
    title.textContent="🏘️ Wilayah";
    suggestions.appendChild(title);

    regions.forEach(region=>{
      const d=document.createElement("div");
      d.className="suggestion suggestion-region";

      const icon=
        region.type==="kabupaten" ? "🏘️" : "📍";

      const typeLabel=
        region.type==="kabupaten"
          ? "Kabupaten / Kota"
          : "Kecamatan";

      d.innerHTML=`
        <b>${icon} ${esc(region.name)}</b>
        <small>
          ${esc(typeLabel)} · ${region.rows.length.toLocaleString("id-ID")} warung
        </small>`;

      d.onclick=()=>selectRegionSuggestion(region);

      suggestions.appendChild(d);
    });
  }

  /* =========================
     SARAN WARUNG
     ========================= */
  const matches=allRows
    .filter(r=>{
      const text=[
        r.name,
        r.description,
        r.kabupaten,
        r.kecamatan
      ].map(normalize).join(" ");

      return text.includes(q);
    })
    .sort((a,b)=>{
      const an=normalize(a.name);
      const bn=normalize(b.name);

      const as=an.startsWith(q) ? 0 : 1;
      const bs=bn.startsWith(q) ? 0 : 1;

      if(as!==bs) return as-bs;
      return an.localeCompare(bn,"id");
    })
    .slice(0,10);

  if(matches.length){
    const title=document.createElement("div");
    title.className="suggestion-group-title";
    title.textContent="🏪 Warung";
    suggestions.appendChild(title);

    matches.forEach(r=>{
      const d=document.createElement("div");

      d.className="suggestion";

      d.innerHTML=`
        <b>🏪 ${esc(r.name || "Warung")}</b>
        <small>
          🏘️ ${esc(r.kabupaten || "Kabupaten belum diisi")}
        </small>`;

      d.onclick=()=>selectSuggestion(r);

      suggestions.appendChild(d);
    });
  }

  if(!regions.length && !matches.length){
    suggestions.innerHTML=
      `<div class="suggestion">
        <b>Tidak ada hasil ditemukan</b>
        <small>Coba nama warung, alamat, Kabupaten/Kota, atau Kecamatan.</small>
      </div>`;
  }

  suggestions.style.display="block";
}

/* Memilih wilayah dari saran pencarian */
function selectRegionSuggestion(region){
  search.value=region.name;
  suggestions.style.display="none";

  selectedLayer.clearLayers();
  selectedMarker=null;

  if(region.type==="kabupaten"){
    /* Sinkronkan dengan filter Kabupaten/Kota yang sudah ada */
    kabupatenSelect.value=region.name;
  }else{
    /* Kecamatan tidak memakai dropdown agar fitur lama tetap utuh */
    kabupatenSelect.value="";
  }

  render(region.rows,true);

  const label=
    region.type==="kabupaten"
      ? "Kabupaten / Kota"
      : "Kecamatan";

  status.textContent=
    `${label}: ${region.name} · ${region.rows.length.toLocaleString("id-ID")} warung`;
}

/*
  PENTING:
  Pencarian TIDAK memfilter semua marker.
  Semua warung tetap ditampilkan.
  Pencarian hanya mengarahkan peta ke warung yang dipilih
  dan memberikan marker highlight.
*/
function selectSuggestion(r){
  search.value=r.name || "";

  suggestions.style.display="none";

  /* Hapus highlight sebelumnya */
  selectedLayer.clearLayers();
  selectedMarker=null;

  const {lat,lng}=getCoord(r);

  if(!Number.isFinite(lat)||!Number.isFinite(lng)){
    status.textContent="Koordinat warung tidak tersedia.";
    return;
  }

  /*
    Jika sedang memakai filter Kabupaten, pertahankan filter tersebut.
    Tetapi jika warung yang dicari berada di luar filter, kita otomatis
    kembalikan dropdown ke Semua Kabupaten agar warung tetap bisa dilihat.
  */
  const selected=normalize(kabupatenSelect.value);

  if(selected && normalize(r.kabupaten)!==selected){
    kabupatenSelect.value="";
    render(allRows,false);
  }else if(!selected){
    /* Semua marker tetap ada */
    render(allRows,false);
  }else{
    applyKabupatenFilter(false);
  }

  /* Zoom ke warung */
  map.setView([lat,lng],17,{animate:true});

  /* Marker highlight */
  selectedMarker=L.marker(
    [lat,lng],
    {icon:makeSearchIcon(),zIndexOffset:2000}
  );

  selectedMarker.bindPopup(popupHtml(r),{
    autoPan:true,
    autoPanPaddingTopLeft:[20,180],
    autoPanPaddingBottomRight:[20,40]
  });

  selectedMarker._row=r;
  selectedMarker.addTo(selectedLayer);
  if(selectedLayer.bringToFront) selectedLayer.bringToFront();

  setTimeout(()=>{
    if(selectedMarker){
      selectedMarker.openPopup();
    }
  },350);
}

/* =========================
   LOKASI SAYA
   ========================= */
document.getElementById("locate").onclick=()=>{
  if(!navigator.geolocation){
    alert("Browser tidak mendukung lokasi.");
    return;
  }

  status.textContent="Mencari lokasi Anda...";

  navigator.geolocation.getCurrentPosition(
    pos=>{
      const lat=pos.coords.latitude;
      const lng=pos.coords.longitude;

      if(userMarker) map.removeLayer(userMarker);
      if(userCircle) map.removeLayer(userCircle);

      userMarker=L.marker([lat,lng])
        .addTo(map)
        .bindPopup("📍 Lokasi Anda")
        .openPopup();

      userCircle=L.circle([lat,lng],{
        radius:pos.coords.accuracy || 50,
        color:"#1976d2",
        fillOpacity:.12
      }).addTo(map);

      map.setView([lat,lng],14);

      status.textContent="Lokasi Anda ditemukan.";
    },
    err=>{
      console.error(err);
      status.textContent="Lokasi tidak dapat diperoleh.";
      alert("Izinkan akses lokasi pada browser, lalu coba lagi.");
    },
    {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:30000
    }
  );
};

/* =========================
   WARUNG TERDEKAT
   ========================= */
document.getElementById("nearby").onclick=()=>{
  if(!userMarker){
    alert("Klik 📍 Lokasi Saya terlebih dahulu.");
    return;
  }

  const user=userMarker.getLatLng();

  const nearby=allRows
    .map(r=>{
      const c=getCoord(r);

      if(!Number.isFinite(c.lat)||!Number.isFinite(c.lng)){
        return null;
      }

      const d=map.distance(user,[c.lat,c.lng]);

      return {...r,_distance:d};
    })
    .filter(Boolean)
    .sort((a,b)=>a._distance-b._distance)
    .slice(0,10);

  const list=document.getElementById("nearbyList");
  list.innerHTML="";

  nearby.forEach(r=>{
    const d=document.createElement("div");

    d.className="nearbyItem";

    const distance=
      r._distance<1000
        ? `${Math.round(r._distance)} m`
        : `${(r._distance/1000).toFixed(1)} km`;

    d.innerHTML=`
      <b>${esc(r.name||"Warung")}</b>
      <small>
        🏘️ ${esc(r.kabupaten||"Kabupaten belum diisi")}
        · 📏 ${distance}
      </small>`;

    d.onclick=()=>{
      selectSuggestion(r);
      closeNearby();
    };

    list.appendChild(d);
  });

  document.getElementById("nearbyPanel").style.display="block";
};

function closeNearby(){
  document.getElementById("nearbyPanel").style.display="none";
}

/* =========================
   LEGEND
   ========================= */
const legend=L.control({position:"bottomright"});

legend.onAdd=function(){
  const div=L.DomUtil.create("div","legend");
  div.innerHTML="<b>🏘️ Kabupaten</b><br>";
  return div;
};

legend.addTo(map);

function updateLegend(){
  const el=document.querySelector(".legend");

  if(!el) return;

  const vals=[
    ...new Set(
      allRows
        .map(r=>r.kabupaten)
        .filter(Boolean)
    )
  ].sort((a,b)=>a.localeCompare(b,"id"));

  el.innerHTML=
    "<b>🏘️ Kabupaten</b><br>"+
    vals.map(k=>
      `<div>
        <i style="background:${colorFor(k)}"></i>
        ${esc(k)}
      </div>`
    ).join("");
}

/* =========================
   LOAD DATA
   ========================= */
async function loadData(){
  status.textContent="Memuat data dari Google Sheets...";

  try{
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),20000);

    const url=CSV_URL+"&_="+Date.now();

    const res=await fetch(url,{
      cache:"no-store",
      signal:controller.signal
    });

    clearTimeout(timeout);

    if(!res.ok){
      throw new Error("HTTP "+res.status);
    }

    const text=await res.text();

    const parsed=parseCSV(text);

    allRows=parsed.filter(r=>{
      const c=getCoord(r);

      return (
        r.name &&
        Number.isFinite(c.lat) &&
        Number.isFinite(c.lng)
      );
    });

    if(!allRows.length){
      throw new Error("Tidak ada data koordinat yang valid.");
    }

    populateKabupaten();
    updateLegend();

    /* Saat pertama dimuat, tampilkan semua warung */
    render(allRows,false);

    status.textContent=
      `Data siap · ${allRows.length.toLocaleString("id-ID")} warung`;

  }catch(err){
    console.error(err);

    if(err.name==="AbortError"){
      status.textContent="Waktu memuat data habis.";
      alert(
        "Google Sheets terlalu lama merespons. " +
        "Coba klik ↻ Muat ulang beberapa saat lagi."
      );
    }else{
      status.textContent="Gagal memuat data.";
      alert(
        "Data Google Sheets gagal dimuat. " +
        "Pastikan spreadsheet sudah dipublikasikan ke web."
      );
    }
  }
}

/* Mulai */
loadData();
</script>
