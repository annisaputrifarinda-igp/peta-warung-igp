<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Peta Warung IGP</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

<style>
*{box-sizing:border-box}
html,body,#map{height:100%;margin:0}
body{font-family:Arial,sans-serif;overflow:hidden;background:#e9eef2}
#map{position:fixed;inset:0;z-index:1}

#controls{
  position:fixed;z-index:2000;top:14px;left:50px;
  width:min(720px,calc(100vw - 100px));
}
.search-row{position:relative}
#search{
  width:100%;height:44px;border:0;border-radius:9px;
  padding:0 14px;font-size:16px;box-shadow:0 2px 10px rgba(0,0,0,.18);
  outline:none;background:#fff;
}
#suggestions{
  position:absolute;left:0;right:0;top:48px;display:none;
  max-height:min(320px,45vh);overflow:auto;background:#fff;
  border-radius:0 0 10px 10px;box-shadow:0 5px 16px rgba(0,0,0,.22);
}
.suggestion{
  padding:10px 14px;border-bottom:1px solid #eee;cursor:pointer;background:#fff
}
.suggestion:hover{background:#f4f7fb}
.suggestion .name{font-weight:700}
.suggestion .meta{font-size:13px;color:#666;margin-top:3px}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
button,select{
  height:40px;border:0;border-radius:8px;background:#fff;
  padding:0 12px;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.16);
  cursor:pointer;
}
select{min-width:220px}
button:hover,select:hover{background:#f6f6f6}

#status{
  position:fixed;left:50px;bottom:14px;z-index:2000;
  background:rgba(255,255,255,.94);padding:8px 12px;border-radius:8px;
  box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:13px;
}
#legend{
  position:fixed;right:10px;bottom:10px;z-index:2000;
  background:rgba(255,255,255,.95);padding:10px 12px;border-radius:8px;
  box-shadow:0 2px 8px rgba(0,0,0,.16);font-size:13px;
}
.legend-title{font-weight:700;margin-bottom:5px}
.legend-row{display:flex;align-items:center;gap:7px;margin:4px 0}
.dot{width:13px;height:13px;border-radius:50%;display:inline-block}

.leaflet-popup-content{margin:14px;min-width:240px}
.popup-title{font-size:16px;font-weight:700;margin-bottom:7px}
.popup-kab{margin-bottom:8px}
.popup-desc{white-space:pre-line;font-size:13px;line-height:1.35}
.maps-btn{
  display:inline-block;margin-top:10px;padding:8px 12px;border-radius:6px;
  background:#1a73e8;color:#fff;text-decoration:none;font-weight:700
}

.loading-overlay{
  position:fixed;inset:0;z-index:1900;display:none;align-items:center;justify-content:center;
  background:rgba(255,255,255,.45);backdrop-filter:blur(1px)
}
.loading-card{background:#fff;padding:16px 20px;border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.18)}

@media(max-width:650px){
  #controls{left:48px;right:10px;width:auto;top:10px}
  select{min-width:0;flex:1}
  .toolbar button{flex:0 0 auto}
  #status{left:10px;bottom:10px}
}
</style>
</head>
<body>
<div id="map"></div>

<div id="controls">
  <div class="search-row">
    <input id="search" autocomplete="off" placeholder="Cari nama warung / alamat / kabupaten...">
    <div id="suggestions"></div>
  </div>

  <div class="toolbar">
    <select id="kabupaten">
      <option value="">🏠 Semua Kabupaten / Kota</option>
    </select>
    <button id="locate">📍 Lokasi Saya</button>
    <button id="nearby">🔎 Warung Terdekat</button>
    <button id="refresh">↻ Muat ulang</button>
    <button id="satellite">🛰️ Satelit</button>
  </div>
</div>

<div id="status">Memuat data...</div>

<div id="legend">
  <div class="legend-title">🏠 Kabupaten</div>
  <div class="legend-row"><span class="dot" style="background:#d32f2f"></span>Lampung Tengah</div>
  <div class="legend-row"><span class="dot" style="background:#c9a227"></span>Lampung Timur</div>
  <div class="legend-row"><span class="dot" style="background:#25a85a"></span>Lampung Utara</div>
  <div class="legend-row"><span class="dot" style="background:#16a085"></span>Tulang Bawang</div>
</div>

<div class="loading-overlay" id="loading">
  <div class="loading-card">Memuat data warung...</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script>
/*
=========================================================
 PETA WARUNG IGP - VERSI FINAL
=========================================================

 FITUR:
 - Pencarian nama/alamat/kabupaten
 - Autocomplete/saran warung
 - Kabupaten/Kota filter
 - Lokasi Saya
 - Warung Terdekat
 - Marker clustering
 - Satelit / Peta Jalan
 - "Lihat di Google Maps" (bukan langsung navigasi)
 - Semua marker warung tetap muncul ketika mencari
 - Popup hasil pencarian otomatis dipusatkan
 - Kontrol pencarian tidak menutupi popup
 - Zoom dibatasi agar tidak meminta tile di luar level yang tersedia
 - Basemap jalan memakai OpenStreetMap Standard

 PERHATIAN:
 Isi CSV_URL dengan URL CSV Google Sheets Anda yang dipakai
 pada versi sebelumnya.
=========================================================
*/

// ======================================================
// 1. URL DATA GOOGLE SHEETS
// ======================================================
// GANTI ISI DI BAWAH dengan URL CSV Google Sheets Anda.
// Contoh:
// const CSV_URL = "https://docs.google.com/spreadsheets/d/e/...../pub?output=csv";
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQP1l3fVYi1dWu0g2UkLdpwcqosl7SUMGqDhibVGx6caqQwHKWWEx-ldWfLxrewHWlSiIm46Bv2uHIb/pub?output=csv";


// ======================================================
// 2. PETA
// ======================================================
// PENTING: maxZoom peta = 19.
// Ini mencegah masalah "Map data not yet available"
// ketika pengguna melakukan zoom terlalu jauh.
const map = L.map("map", {
  zoomControl: true,
  maxZoom: 19,
  minZoom: 3,
  preferCanvas: true,
  zoomAnimation: true,
  fadeAnimation: true,
  markerZoomAnimation: true
}).setView([-4.85, 105.45], 9);


// ======================================================
// 3. BASEMAP JALAN
// ======================================================
// OpenStreetMap Standard dipakai sebagai peta jalan utama.
// maxNativeZoom + maxZoom sama-sama 19 agar tidak meminta
// tile kosong pada level zoom yang lebih tinggi.
const roadLayer = L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    maxNativeZoom: 19,
    updateWhenZooming: false,
    updateWhenIdle: true,
    keepBuffer: 4,
    attribution:
      '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors'
  }
).addTo(map);


// ======================================================
// 4. BASEMAP SATELIT
// ======================================================
const satelliteLayer = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  {
    maxZoom: 19,
    maxNativeZoom: 19,
    updateWhenZooming: false,
    updateWhenIdle: true,
    keepBuffer: 4,
    attribution: "Tiles &copy; Esri"
  }
);

let currentBase = "road";


// ======================================================
// 5. DATA & STATE
// ======================================================
let allRows = [];
let visibleRows = [];
let userLocation = null;
let userMarker = null;

const cluster = L.markerClusterGroup({
  chunkedLoading: true,
  chunkInterval: 80,
  chunkDelay: 20,
  maxClusterRadius: 45,
  spiderfyOnMaxZoom: true,
  showCoverageOnHover: false,
  removeOutsideVisibleBounds: true
});

map.addLayer(cluster);


// ======================================================
// 6. HELPER
// ======================================================
const $ = id => document.getElementById(id);

const search = $("search");
const suggestions = $("suggestions");
const kabupaten = $("kabupaten");
const status = $("status");
const loading = $("loading");

function clean(v) {
  return String(v ?? "").trim();
}

function norm(v) {
  return clean(v)
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

function num(v) {
  let s = clean(v).replace(/\s/g, "");
  if (!s) return NaN;

  // Contoh: -4.995.378,6
  if (/^-?\d{1,3}(\.\d{3})+,\d+$/.test(s)) {
    s = s.replace(/\./g, "").replace(",", ".");
  }
  // Contoh: 1,055,349.567
  else if (/^-?\d{1,3}(,\d{3})+\.\d+$/.test(s)) {
    s = s.replace(/,/g, "");
  }
  // Contoh: -4,995378
  else if (s.includes(",") && !s.includes(".")) {
    s = s.replace(",", ".");
  }
  // Contoh: 1,055349567
  else {
    s = s.replace(/,/g, "");
  }

  return Number(s);
}

function escapeHtml(s) {
  return clean(s).replace(
    /[&<>"']/g,
    m => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[m])
  );
}


// ======================================================
// 7. CSV PARSER
// ======================================================
function parseCSV(text) {
  const rows = [];
  let row = [];
  let cell = "";
  let quoted = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    const n = text[i + 1];

    if (c === '"' && quoted && n === '"') {
      cell += '"';
      i++;
      continue;
    }

    if (c === '"') {
      quoted = !quoted;
      continue;
    }

    if (c === "," && !quoted) {
      row.push(cell);
      cell = "";
      continue;
    }

    if ((c === "\n" || c === "\r") && !quoted) {
      if (c === "\r" && n === "\n") i++;

      row.push(cell);
      cell = "";

      if (row.some(x => clean(x) !== "")) {
        rows.push(row);
      }

      row = [];
      continue;
    }

    cell += c;
  }

  row.push(cell);

  if (row.some(x => clean(x) !== "")) {
    rows.push(row);
  }

  return rows;
}


// ======================================================
// 8. UBAH CSV MENJADI DATA WARUNG
// ======================================================
function makeObjects(csv) {
  const raw = parseCSV(csv);

  if (raw.length < 2) return [];

  const headers = raw[0].map(x =>
    norm(x).replace(/[^a-z0-9_]/g, "_")
  );

  function idx(names) {
    for (const name of names) {
      const key = norm(name).replace(/[^a-z0-9_]/g, "_");
      const i = headers.indexOf(key);
      if (i >= 0) return i;
    }
    return -1;
  }

  const iName = idx([
    "name",
    "nama",
    "nama_warung",
    "warung"
  ]);

  const iLat = idx([
    "latitude_benar",
    "latitude",
    "lat"
  ]);

  const iLng = idx([
    "longitude_benar",
    "longitude",
    "lng",
    "lon"
  ]);

  const iDesc = idx([
    "description",
    "deskripsi",
    "alamat",
    "keterangan"
  ]);

  const iKab = idx([
    "kabupaten_kota",
    "kabupaten / kota",
    "kabupaten/kota",
    "kabupaten",
    "kota"
  ]);

  return raw
    .slice(1)
    .map(r => ({
      name: clean(r[iName]),
      lat: num(r[iLat]),
      lng: num(r[iLng]),
      desc: clean(r[iDesc]),
      kab: clean(r[iKab])
    }))
    .filter(
      x =>
        x.name &&
        Number.isFinite(x.lat) &&
        Number.isFinite(x.lng)
    );
}


// ======================================================
// 9. WARNA MARKER
// ======================================================
function colorForKab(k) {
  const n = norm(k);

  if (n.includes("lampung tengah")) return "#d32f2f";
  if (n.includes("lampung timur")) return "#c9a227";
  if (n.includes("lampung utara")) return "#25a85a";
  if (n.includes("tulang bawang")) return "#16a085";
  if (n.includes("tulang bawang barat")) return "#16a085";

  const palette = [
    "#7b61a8",
    "#e67e22",
    "#2e86de",
    "#8e44ad",
    "#00897b",
    "#c2185b",
    "#6d4c41"
  ];

  let h = 0;
  for (let i = 0; i < n.length; i++) {
    h = (h * 31 + n.charCodeAt(i)) >>> 0;
  }

  return palette[h % palette.length];
}


// ======================================================
// 10. ICON MARKER
// ======================================================
function markerIcon(row, highlighted = false) {
  const color = colorForKab(row.kab);
  const size = highlighted ? 34 : 30;
  const opacity = highlighted ? 1 : 0.35;

  return L.divIcon({
    className: "custom-marker",
    iconSize: [size, size],
    iconAnchor: [size / 2, size],

    html: `
      <div style="
        width:${size}px;
        height:${size}px;
        border-radius:50% 50% 50% 0;
        transform:rotate(-45deg);
        background:${color};
        opacity:${opacity};
        border:3px solid #fff;
        box-shadow:0 2px 6px rgba(0,0,0,.35);
      ">
        <div style="
          transform:rotate(45deg);
          color:#fff;
          text-align:center;
          font-weight:bold;
          font-size:12px;
          line-height:${size - 6}px;
        ">●</div>
      </div>
    `
  });
}


// ======================================================
// 11. GOOGLE MAPS
// ======================================================
function mapsUrl(row) {
  return (
    "https://www.google.com/maps/search/?api=1&query=" +
    encodeURIComponent(row.lat + "," + row.lng)
  );
}


// ======================================================
// 12. POPUP
// ======================================================
function popupHtml(row) {
  return `
    <div>
      <div class="popup-title">
        ${escapeHtml(row.name)}
      </div>

      <div class="popup-kab">
        <b>Kabupaten:</b>
        ${escapeHtml(row.kab || "Tidak diisi")}
      </div>

      <div class="popup-desc">
        ${escapeHtml(row.desc || "Tidak ada keterangan")}
      </div>

      <a
        class="maps-btn"
        href="${mapsUrl(row)}"
        target="_blank"
        rel="noopener"
      >
        🗺️ Lihat di Google Maps
      </a>
    </div>
  `;
}


// ======================================================
// 13. RENDER MARKER
// ======================================================
function render(rows = allRows, fit = false) {
  cluster.clearLayers();

  visibleRows = rows;

  const searchTerm = norm(search.value);

  rows.forEach(row => {
    const hit =
      !searchTerm ||
      norm(row.name + " " + row.desc + " " + row.kab)
        .includes(searchTerm);

    const marker = L.marker(
      [row.lat, row.lng],
      {
        icon: markerIcon(row, hit)
      }
    );

    marker.bindPopup(
      popupHtml(row),
      {
        autoPan: true,

        // Popup akan diberi ruang dari bilah pencarian.
        // Jadi saat hasil dicari, popup tidak tertutup kontrol.
        autoPanPaddingTopLeft: [20, 190],
        autoPanPaddingBottomRight: [20, 40]
      }
    );

    cluster.addLayer(marker);
  });

  status.textContent =
    `Menampilkan ${rows.length.toLocaleString("id-ID")} warung`;

  if (fit && rows.length) {
    const bounds = L.latLngBounds(
      rows.map(r => [r.lat, r.lng])
    );

    if (bounds.isValid()) {
      map.fitBounds(bounds, {
        paddingTopLeft: [30, 180],
        paddingBottomRight: [30, 30],
        maxZoom: 15
      });
    }
  }
}


// ======================================================
// 14. DROPDOWN KABUPATEN/KOTA
// ======================================================
function fillKabupaten() {
  const vals = [
    ...new Set(
      allRows
        .map(r => r.kab)
        .filter(Boolean)
    )
  ].sort((a, b) => a.localeCompare(b, "id"));

  kabupaten.innerHTML =
    '<option value="">🏠 Semua Kabupaten / Kota</option>';

  vals.forEach(v => {
    const option = document.createElement("option");
    option.value = v;
    option.textContent = v;
    kabupaten.appendChild(option);
  });
}


// ======================================================
// 15. FILTER
// ======================================================
function filteredRows() {
  const k = norm(kabupaten.value);

  if (!k) return allRows;

  return allRows.filter(
    r => norm(r.kab) === k
  );
}

function applyFilters(fit = false) {
  render(filteredRows(), fit);
}


// ======================================================
// 16. AUTOCOMPLETE / SARAN
// ======================================================
function showSuggestions() {
  const q = norm(search.value);

  if (!q) {
    suggestions.style.display = "none";
    return;
  }

  const matches = allRows
    .filter(r =>
      norm(
        r.name + " " +
        r.desc + " " +
        r.kab
      ).includes(q)
    )
    .slice(0, 12);

  suggestions.innerHTML = "";

  matches.forEach(r => {
    const div = document.createElement("div");

    div.className = "suggestion";

    div.innerHTML = `
      <div class="name">
        ${escapeHtml(r.name)}
      </div>
      <div class="meta">
        🏠 ${escapeHtml(
          r.kab || "Kabupaten belum diisi"
        )}
      </div>
    `;

    div.onclick = () => {
      search.value = r.name;
      suggestions.style.display = "none";

      // SEMUA WARUNG TETAP DITAMPILKAN.
      // Hanya hasil yang dicari dibuat lebih menonjol.
      render(filteredRows(), false);

      map.setView(
        [r.lat, r.lng],
        16,
        { animate: true }
      );

      setTimeout(() => {
        let found = false;

        cluster.eachLayer(marker => {
          const pos = marker.getLatLng();

          if (
            Math.abs(pos.lat - r.lat) < 0.000001 &&
            Math.abs(pos.lng - r.lng) < 0.000001
          ) {
            marker.openPopup();
            found = true;
          }
        });

        // Jika marker sedang berada di dalam cluster,
        // zoom sedikit lebih dekat agar popup dapat dibuka.
        if (!found) {
          map.setView([r.lat, r.lng], 17, {animate:true});

          setTimeout(() => {
            cluster.eachLayer(marker => {
              const pos = marker.getLatLng();

              if (
                Math.abs(pos.lat - r.lat) < 0.000001 &&
                Math.abs(pos.lng - r.lng) < 0.000001
              ) {
                marker.openPopup();
              }
            });
          }, 250);
        }
      }, 300);
    };

    suggestions.appendChild(div);
  });

  suggestions.style.display =
    matches.length ? "block" : "none";
}


// ======================================================
// 17. EVENT SEARCH
// ======================================================
let searchTimer;

search.addEventListener("input", () => {
  clearTimeout(searchTimer);

  showSuggestions();

  searchTimer = setTimeout(() => {
    // Jangan menghapus warung lain.
    render(filteredRows(), false);
  }, 80);
});

search.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    suggestions.style.display = "none";
  }
});

document.addEventListener("click", e => {
  if (!e.target.closest(".search-row")) {
    suggestions.style.display = "none";
  }
});


// ======================================================
// 18. FILTER KABUPATEN
// ======================================================
kabupaten.addEventListener("change", () => {
  search.value = "";
  suggestions.style.display = "none";
  applyFilters(true);
});


// ======================================================
// 19. MUAT ULANG
// ======================================================
$("refresh").onclick = loadData;


// ======================================================
// 20. SATELIT / PETA JALAN
// ======================================================
$("satellite").onclick = () => {
  if (currentBase === "road") {

    map.removeLayer(roadLayer);
    satelliteLayer.addTo(map);

    currentBase = "satellite";
    $("satellite").textContent = "🗺️ Peta Jalan";

  } else {

    map.removeLayer(satelliteLayer);
    roadLayer.addTo(map);

    currentBase = "road";
    $("satellite").textContent = "🛰️ Satelit";
  }

  // Paksa Leaflet menghitung ulang ukuran setelah pergantian layer.
  setTimeout(() => map.invalidateSize(), 100);
};


// ======================================================
// 21. LOKASI SAYA
// ======================================================
$("locate").onclick = () => {
  if (!navigator.geolocation) {
    alert("Browser tidak mendukung lokasi.");
    return;
  }

  navigator.geolocation.getCurrentPosition(
    pos => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;

      userLocation = [lat, lng];

      if (userMarker) {
        map.removeLayer(userMarker);
      }

      userMarker = L.marker(
        [lat, lng],
        {
          icon: L.divIcon({
            className: "",
            iconSize: [18, 18],
            iconAnchor: [9, 9],

            html: `
              <div style="
                width:18px;
                height:18px;
                border-radius:50%;
                background:#1976d2;
                border:3px solid #fff;
                box-shadow:0 1px 6px rgba(0,0,0,.4);
              "></div>
            `
          })
        }
      )
      .addTo(map)
      .bindPopup("📍 Lokasi Saya");

      map.setView(
        [lat, lng],
        15,
        { animate: true }
      );
    },

    () => {
      alert(
        "Lokasi tidak dapat diambil. " +
        "Pastikan izin lokasi di browser sudah diaktifkan."
      );
    },

    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 60000
    }
  );
};


// ======================================================
// 22. WARUNG TERDEKAT
// ======================================================
$("nearby").onclick = () => {
  if (!userLocation) {
    alert(
      "Klik '📍 Lokasi Saya' terlebih dahulu agar " +
      "jarak warung dapat dihitung."
    );
    return;
  }

  const [ul, un] = userLocation;

  function distanceKm(r) {
    const dx = (r.lat - ul) * 111;
    const dy =
      (r.lng - un) *
      111 *
      Math.cos(ul * Math.PI / 180);

    return Math.sqrt(dx * dx + dy * dy);
  }

  const rows = [...filteredRows()]
    .sort(
      (a, b) =>
        distanceKm(a) - distanceKm(b)
    )
    .slice(0, 100);

  render(rows, true);
};


// ======================================================
// 23. LOAD DATA
// ======================================================
async function loadData() {

  if (
    !CSV_URL ||
    CSV_URL.includes("PASTE_URL")
  ) {
    status.textContent =
      "URL CSV belum diisi";

    alert(
      "Index.html sudah siap.\\n\\n" +
      "Isi variabel CSV_URL di bagian atas " +
      "dengan URL CSV Google Sheets Anda."
    );

    return;
  }

  loading.style.display = "flex";
  status.textContent = "Memuat data...";

  try {

    const url =
      CSV_URL +
      (CSV_URL.includes("?") ? "&" : "?") +
      "_ts=" +
      Date.now();

    const response =
      await fetch(
        url,
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {
      throw new Error(
        "HTTP " + response.status
      );
    }

    const text =
      await response.text();

    const data =
      makeObjects(text);

    if (!data.length) {
      throw new Error(
        "Tidak ada data valid. " +
        "Pastikan kolom name, latitude_benar/latitude, " +
        "longitude_benar/longitude tersedia."
      );
    }

    allRows = data;

    fillKabupaten();

    render(
      allRows,
      false
    );

    // Fit hanya SATU KALI setelah data selesai dimuat.
    // Setelah itu zoom/pencarian tidak akan memindahkan
    // peta ke seluruh Indonesia lagi.
    const bounds =
      L.latLngBounds(
        data.map(
          r => [r.lat, r.lng]
        )
      );

    if (bounds.isValid()) {
      map.fitBounds(
        bounds,
        {
          paddingTopLeft: [30, 170],
          paddingBottomRight: [30, 30],
          maxZoom: 13
        }
      );
    }

  } catch (err) {

    console.error(err);

    status.textContent =
      "Gagal memuat data";

    alert(
      "Data Google Sheets gagal dimuat.\\n\\n" +
      "Pastikan Sheet sudah dipublikasikan sebagai CSV " +
      "dan URL CSV benar.\\n\\n" +
      err.message
    );

  } finally {

    loading.style.display = "none";
  }
};


// ======================================================
// 24. RESPONSIVE / RESIZE
// ======================================================
window.addEventListener(
  "resize",
  () => map.invalidateSize()
);

window.addEventListener(
  "orientationchange",
  () => {
    setTimeout(
      () => map.invalidateSize(),
      300
    );
  }
);


// ======================================================
// 25. MULAI
// ======================================================
loadData();

</script>
</body>
</html>
