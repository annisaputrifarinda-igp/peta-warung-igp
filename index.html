<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peta Warung IGP</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
html,body,#map{height:100%;margin:0;padding:0}body{font-family:Arial,sans-serif;overflow:hidden}
#searchBox{position:absolute;z-index:1000;top:12px;left:60px;width:min(520px,calc(100% - 90px));display:flex;gap:6px}
#search{flex:1;padding:11px 13px;border:1px solid #ccc;border-radius:8px;font-size:15px;outline:none;box-shadow:0 2px 8px rgba(0,0,0,.15)}
button{padding:10px 13px;border:0;border-radius:8px;background:white;cursor:pointer;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
button:hover{background:#f0f0f0}
#status{position:absolute;z-index:1000;left:12px;bottom:12px;padding:7px 10px;border-radius:6px;background:rgba(255,255,255,.95);font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.popup-title{font-size:16px;font-weight:bold;margin-bottom:7px}.popup-region{display:inline-block;padding:3px 7px;margin-bottom:7px;border-radius:5px;color:white;font-size:12px;font-weight:bold}.popup-description{font-size:13px;line-height:1.4;max-width:300px;margin-bottom:10px}
.maps-button{display:inline-block;padding:8px 11px;border-radius:6px;background:#1a73e8;color:white!important;text-decoration:none;font-size:13px;font-weight:bold}.maps-button:hover{background:#1557b0}
.colored-marker{width:18px;height:18px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid white;box-shadow:0 2px 5px rgba(0,0,0,.35)}.colored-marker-inner{width:6px;height:6px;background:white;border-radius:50%;position:absolute;top:4px;left:4px}
.marker-cluster div{font-weight:bold}
</style>
</head>
<body>
<div id="searchBox">
<input id="search" type="text" placeholder="Cari nama warung / alamat / kabupaten..." autocomplete="off">
<button id="refresh">↻ Muat ulang</button>
</div>
<div id="map"></div><div id="status">Memuat data...</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQP1l3fVYi1dWu0g2UkLdpwcqosl7SUMGqDhibVGx6caqQwHKWWEx-ldWfLxrewHWlSiIm46Bv2uHIb/pub?output=csv";

const map=L.map("map",{preferCanvas:true}).setView([-4.8,105.4],7);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap contributors"}).addTo(map);

const clusterGroup=L.markerClusterGroup({
chunkedLoading:true,chunkInterval:100,chunkDelay:10,removeOutsideVisibleBounds:true,
maxClusterRadius:55,disableClusteringAtZoom:15,spiderfyOnMaxZoom:true,
showCoverageOnHover:false,zoomToBoundsOnClick:true
});
map.addLayer(clusterGroup);

let allRows=[],regionColors={};
const colors=["#e53935","#1e88e5","#43a047","#8e24aa","#fb8c00","#00acc1","#6d4c41","#3949ab","#d81b60","#00897b","#f4511e","#5e35b1","#7cb342","#039be5","#c0ca33","#ffb300","#546e7a","#8d6e63","#26a69a","#ef5350"];

function clean(v){return String(v??"").trim()}
function normalizeHeader(v){return clean(v).toLowerCase().replace(/\s+/g," ").trim()}
function num(v){
if(v==null)return NaN;let s=String(v).trim().replace(/\s/g,"");if(!s)return NaN;
if(s.includes(",")&&!s.includes("."))s=s.replace(",",".");s=s.replace(/[^0-9.,-]/g,"");
if(s.includes(",")&&s.includes(".")){const lc=s.lastIndexOf(","),ld=s.lastIndexOf(".");if(lc>ld)s=s.replace(/\./g,"").replace(",",".");else s=s.replace(/,/g,"")}
return Number(s)
}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}

function parseCSV(text){
const rows=[];let row=[],cell="",quoted=false;
for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];
if(c=='"'){if(quoted&&n=='"'){cell+='"';i++}else quoted=!quoted}
else if(c==","&&!quoted){row.push(cell);cell=""}
else if((c=="\n"||c=="\r")&&!quoted){if(c=="\r"&&n=="\n")i++;row.push(cell);cell="";if(row.some(v=>clean(v)!==""))rows.push(row);row=[]}
else cell+=c}
if(cell!==""||row.length){row.push(cell);if(row.some(v=>clean(v)!==""))rows.push(row)}
return rows
}

function regionColor(region){
region=clean(region)||"Tidak diketahui";
if(!regionColors[region])regionColors[region]=colors[Object.keys(regionColors).length%colors.length];
return regionColors[region]
}

function icon(color){
return L.divIcon({className:"",html:'<div class="colored-marker" style="background:'+color+'"><div class="colored-marker-inner"></div></div>',iconSize:[22,22],iconAnchor:[11,22],popupAnchor:[0,-20]})
}

function makeMarker(item){
const color=regionColor(item.region);
const mapsUrl="https://www.google.com/maps?q="+encodeURIComponent(item.lat+","+item.lng);
const m=L.marker([item.lat,item.lng],{icon:icon(color)});
m.bindPopup(
'<div class="popup-title">'+esc(item.name)+'</div>'+
'<div class="popup-region" style="background:'+color+'">'+esc(item.region||"Tidak diketahui")+'</div>'+
(item.description?'<div class="popup-description">'+esc(item.description)+'</div>':'')+
'<a class="maps-button" href="'+mapsUrl+'" target="_blank" rel="noopener noreferrer">📍 Buka di Google Maps</a>'
);
return m
}

async function loadData(){
const status=document.getElementById("status");status.textContent="Memuat data Google Sheets...";
try{
const response=await fetch(CSV_URL+"&_="+Date.now(),{cache:"no-store"});
if(!response.ok)throw Error("HTTP "+response.status);
const table=parseCSV(await response.text());if(!table.length)throw Error("Data Google Sheets kosong");
const headers=table[0].map(normalizeHeader);
function idx(...names){for(const n of names){const i=headers.indexOf(normalizeHeader(n));if(i!=-1)return i}return -1}
const ni=idx("name","nama"),la=idx("latitude_benar","latitude benar"),lo=idx("longitude_benar","longitude benar"),di=idx("description","deskripsi"),ri=idx("kabupaten/kota","kabupaten","kota");
if(ni==-1||la==-1||lo==-1)throw Error("Kolom name, latitude_benar atau longitude_benar tidak ditemukan.");
const data=[];
for(let i=1;i<table.length;i++){
const r=table[i],name=clean(r[ni]),lat=num(r[la]),lng=num(r[lo]),description=di>=0?clean(r[di]):"",region=ri>=0?clean(r[ri]):"Tidak diketahui";
if(!name||!Number.isFinite(lat)||!Number.isFinite(lng))continue;
if(lat<-11||lat>7||lng<95||lng>142)continue;
data.push({name,lat,lng,description,region})
}
allRows=data;renderMarkers(allRows);status.textContent="Menampilkan "+allRows.length.toLocaleString("id-ID")+" warung"
}catch(e){console.error(e);status.textContent="Gagal memuat data: "+e.message}
}

function renderMarkers(data){
clusterGroup.clearLayers();regionColors={};
clusterGroup.addLayers(data.map(makeMarker));
if(data.length>0&&data.length<50){const b=L.latLngBounds(data.map(x=>[x.lat,x.lng]));if(b.isValid())map.fitBounds(b,{padding:[40,40],maxZoom:14})}
}

document.getElementById("search").addEventListener("input",function(){
const q=clean(this.value).toLowerCase();
if(!q){renderMarkers(allRows);map.setView([-4.8,105.4],7);document.getElementById("status").textContent="Menampilkan "+allRows.length.toLocaleString("id-ID")+" warung";return}
const results=allRows.filter(x=>(x.name+" "+x.description+" "+x.region).toLowerCase().includes(q));
renderMarkers(results);document.getElementById("status").textContent="Ditemukan "+results.length.toLocaleString("id-ID")+" warung"
});
document.getElementById("refresh").addEventListener("click",loadData);
loadData();
setInterval(loadData,300000);
</script>
</body>
</html>
