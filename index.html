<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peta Warung IGP</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
html,body,#map{height:100%;margin:0}body{font-family:Arial,sans-serif}
#search{position:absolute;z-index:1000;top:12px;left:48px;width:min(440px,calc(100% - 170px));padding:12px 14px;border:1px solid #ccc;border-radius:8px;box-shadow:0 2px 8px #0003;font-size:16px;box-sizing:border-box}
#reload{position:absolute;z-index:1000;top:12px;right:10px;padding:11px 14px;border:0;border-radius:8px;background:#fff;box-shadow:0 2px 8px #0003;cursor:pointer}
#suggest{position:absolute;z-index:1100;top:57px;left:48px;width:min(440px,calc(100% - 170px));max-height:300px;overflow:auto;background:#fff;border-radius:0 0 8px 8px;box-shadow:0 4px 12px #0003;display:none}
.item{padding:10px 14px;border-bottom:1px solid #eee;cursor:pointer}.item:hover{background:#f3f3f3}.item b{display:block}.item small{color:#666}
#status{position:absolute;z-index:1000;left:10px;bottom:10px;background:#fffc;padding:8px 12px;border-radius:7px;box-shadow:0 2px 7px #0003;font-size:13px}
#legend{position:absolute;z-index:1000;right:10px;bottom:45px;max-width:230px;max-height:240px;overflow:auto;background:#fffc;padding:10px 12px;border-radius:8px;box-shadow:0 2px 8px #0003;font-size:12px}.legend-title{font-weight:bold;margin-bottom:6px}.lr{display:flex;align-items:center;margin:4px 0}.dot{width:12px;height:12px;border-radius:50%;margin-right:7px;border:1px solid #0003;flex:none}
@media(max-width:600px){#search{left:48px;width:calc(100% - 110px)}#reload{top:62px}#suggest{left:48px;width:calc(100% - 110px);top:57px}}
</style>
</head>
<body>
<input id="search" placeholder="Cari nama warung / alamat / kabupaten-kota..." autocomplete="off">
<button id="reload">↻ Muat ulang</button>
<div id="suggest"></div><div id="map"></div><div id="status">Memuat data...</div><div id="legend"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vQP1l3fVYi1dWu0g2UkLdpwcqosl7SUMGqDhibVGx6caqQwHKWWEx-ldWfLxrewHWlSiIm46Bv2uHIb/pub?output=csv';
const map=L.map('map',{preferCanvas:true}).setView([-4.8,105.4],9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const clusters=L.markerClusterGroup({chunkedLoading:true,chunkInterval:80,chunkDelay:20,removeOutsideVisibleBounds:true,maxClusterRadius:55,showCoverageOnHover:false});
map.addLayer(clusters);
let rows=[];let areaColors=new Map();
const palette=['#e53935','#8e24aa','#3949ab','#1e88e5','#00897b','#43a047','#7cb342','#f9a825','#fb8c00','#6d4c41','#546e7a','#d81b60','#5e35b1','#00acc1','#c0ca33','#f4511e','#757575','#039be5','#00897b','#9e9d24'];
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function num(v){if(v==null)return NaN;let s=String(v).trim();if(!s)return NaN;let n=Number(s);if(Number.isFinite(n))return n;s=s.replace(/\./g,'').replace(',','.');return Number(s)}
function coord(r){let lat=num(r.latOK),lng=num(r.lngOK);if(!Number.isFinite(lat)||!Number.isFinite(lng)){lat=num(r.lat);lng=num(r.lng);if(Math.abs(lat)>90)lat/=1e7;if(Math.abs(lng)>180)lng/=1e7}return Number.isFinite(lat)&&Number.isFinite(lng)&&lat>=-90&&lat<=90&&lng>=-180&&lng<=180?[lat,lng]:null}
function parseCSV(t){let out=[],r=[],c='',q=false;for(let i=0;i<t.length;i++){let x=t[i],n=t[i+1];if(x==='"'&&q&&n==='"'){c+='"';i++;continue}if(x==='"'){q=!q;continue}if(x===','&&!q){r.push(c);c='';continue}if((x==='\n'||x==='\r')&&!q){if(x==='\r'&&n==='\n')i++;r.push(c);if(r.some(v=>v.trim()))out.push(r);r=[];c='';continue}c+=x}if(c||r.length){r.push(c);if(r.some(v=>v.trim()))out.push(r)}return out}
function icon(color){return L.divIcon({className:'',iconSize:[28,28],iconAnchor:[14,28],popupAnchor:[0,-27],html:`<div style="width:22px;height:22px;border-radius:50% 50% 50% 0;background:${color};border:2px solid white;box-shadow:0 2px 5px #0006;transform:rotate(-45deg);position:relative"><i style="position:absolute;width:7px;height:7px;border-radius:50%;background:white;left:7.5px;top:7.5px"></i></div>`})}
function color(area){let k=(area||'Tidak diketahui').trim().toLowerCase();if(!areaColors.has(k))areaColors.set(k,palette[areaColors.size%palette.length]);return areaColors.get(k)}
function popup(r,p){let u='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p[0]+','+p[1]);return `<b style="font-size:15px">${esc(r.name||'Tanpa nama')}</b><br><small>Kabupaten / Kota: <b>${esc(r.area||'Tidak diketahui')}</b></small><br>${r.desc?`<div style="margin:7px 0">${esc(r.desc)}</div>`:''}<a href="${u}" target="_blank" rel="noopener" style="display:inline-block;background:#4285f4;color:white;padding:7px 10px;border-radius:6px;text-decoration:none">📍 Buka di Google Maps</a>`}
function render(list,fit=false){clusters.clearLayers();let ms=[];list.forEach(r=>{let p=coord(r);if(!p)return;let m=L.marker(p,{icon:icon(color(r.area)),title:r.name||''});m._row=r;m.bindPopup(popup(r,p));r._marker=m;ms.push(m)});clusters.addLayers(ms);if(fit&&ms.length)map.fitBounds(L.featureGroup(ms).getBounds().pad(.08));document.getElementById('status').textContent='Menampilkan '+list.length.toLocaleString('id-ID')+' warung';renderLegend()}
function renderLegend(){let e=[...areaColors.entries()].sort((a,b)=>a[0].localeCompare(b[0],'id'));document.getElementById('legend').innerHTML=e.length?'<div class="legend-title">Kabupaten / Kota</div>'+e.map(([k,c])=>`<div class="lr"><span class="dot" style="background:${c}"></span>${esc(k.replace(/\b\w/g,x=>x.toUpperCase()))}</div>`).join(''):''}
function searchText(r){return [r.name,r.desc,r.area].join(' ').toLowerCase()}
function suggest(q){q=q.trim().toLowerCase();let box=document.getElementById('suggest');if(!q){box.style.display='none';return}let a=rows.filter(r=>searchText(r).includes(q)).slice(0,10);box.innerHTML=a.length?a.map((r,i)=>`<div class="item" data-i="${i}"><b>${esc(r.name||'Tanpa nama')}</b><small>${esc(r.area||'Kabupaten / Kota belum diisi')}</small></div>`).join(''):'<div class="item">Tidak ada hasil.</div>';box.style.display='block';box.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>select(a[+x.dataset.i]))}
function select(r){let p=coord(r);if(!p)return;document.getElementById('search').value=r.name||'';document.getElementById('suggest').style.display='none';map.setView(p,17);clusters.zoomToShowLayer(r._marker,()=>r._marker.openPopup())}
document.getElementById('search').addEventListener('input',e=>suggest(e.target.value));
document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('suggest').style.display='none';if(e.key==='Enter'){let q=e.target.value.trim().toLowerCase();let r=rows.find(x=>(x.name||'').toLowerCase()===q)||rows.find(x=>searchText(x).includes(q));if(r)select(r)}});
document.addEventListener('click',e=>{if(!e.target.closest('#search')&&!e.target.closest('#suggest'))document.getElementById('suggest').style.display='none'});
async function load(){document.getElementById('status').textContent='Memuat data...';try{let res=await fetch(CSV_URL+'&_='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);let t=parseCSV(await res.text());if(t.length<2)throw Error('Data kosong');let h=t[0].map(x=>x.trim().toLowerCase());let idx=(...a)=>{for(let x of a){let i=h.indexOf(x);if(i>=0)return i}return -1};let ni=idx('name','nama'),li=idx('latitude'),gi=idx('longitude'),di=idx('description','deskripsi'),lbi=idx('latitude_benar'),ai=idx('kabupaten / kota','kabupaten/kota','kabupaten','kota'),gbi=idx('longitude_benar');rows=t.slice(1).map(a=>({name:ni>=0?a[ni]:'',lat:li>=0?a[li]:'',lng:gi>=0?a[gi]:'',desc:di>=0?a[di]:'',latOK:lbi>=0?a[lbi]:'',area:ai>=0?a[ai]:'',lngOK:gbi>=0?a[gbi]:''})).filter(r=>coord(r));areaColors.clear();render(rows,true)}catch(e){console.error(e);document.getElementById('status').textContent='Gagal memuat data. Tekan Muat ulang.'}}
document.getElementById('reload').onclick=load;load();
</script>
</body>
</html>
