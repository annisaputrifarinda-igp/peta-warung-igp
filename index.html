<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peta Warung IGP</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0}
#search{position:absolute;z-index:1000;top:12px;left:60px;width:min(420px,calc(100% - 90px));padding:11px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;background:#fff;font-size:15px}
#status{position:absolute;z-index:1000;left:12px;bottom:12px;padding:7px 10px;border-radius:6px;background:rgba(255,255,255,.92);font:13px Arial}
#refresh{position:absolute;z-index:1000;top:62px;left:60px;padding:8px 11px;border:0;border-radius:7px;background:#fff;box-shadow:0 2px 7px rgba(0,0,0,.2)}
</style>
</head>
<body>
<input id="search" placeholder="Cari nama warung / alamat...">
<button id="refresh">↻ Muat ulang</button>
<div id="map"></div>
<div id="status">Memuat data...</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQP1l3fVYi1dWu0g2UkLdpwcqosl7SUMGqDhibVGx6caqQwHKWWEx-ldWfLxrewHWlSiIm46Bv2uHIb/pub?output=csv";
const map=L.map("map").setView([-4.8,105.4],9);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap contributors"}).addTo(map);
const layer=L.layerGroup().addTo(map); let allRows=[];

function parseCSV(t){
 let rows=[],row=[],cell="",q=false;
 for(let i=0;i<t.length;i++){let c=t[i],n=t[i+1];
  if(c=='"'){if(q&&n=='"'){cell+='"';i++;}else q=!q;}
  else if(c==','&&!q){row.push(cell);cell="";}
  else if((c=='\n'||c=='\r')&&!q){if(c=='\r'&&n=='\n')i++;row.push(cell);cell="";if(row.some(v=>v.trim()))rows.push(row);row=[];}
  else cell+=c;
 }
 if(cell||row.length){row.push(cell);rows.push(row)} return rows;
}
function esc(s){return String(s||"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]));}
function render(filter=""){
 layer.clearLayers(); let q=filter.toLowerCase().trim(), shown=0,bounds=[];
 allRows.forEach(r=>{
  let name=(r[0]||"").trim(),desc=(r[3]||"").trim(),lat=parseFloat((r[4]||"").replace(",", ".")),lon=parseFloat((r[5]||"").replace(",", "."));
  if(!name||!Number.isFinite(lat)||!Number.isFinite(lon)||lat<-90||lat>90||lon<-180||lon>180)return;
  if(q&&!((name+" "+desc).toLowerCase().includes(q)))return;
  let m=L.marker([lat,lon]).addTo(layer);m.bindPopup("<b>"+esc(name)+"</b>"+(desc?"<br>"+esc(desc):""));
  bounds.push([lat,lon]);shown++;
 });
 document.getElementById("status").textContent=shown.toLocaleString("id-ID")+" marker ditampilkan";
 if(!q&&bounds.length)map.fitBounds(bounds,{padding:[20,20],maxZoom:13});
}
async function loadData(){
 document.getElementById("status").textContent="Memuat data Google Sheets...";
 try{
  let res=await fetch(CSV_URL+"&_="+Date.now(),{cache:"no-store"}); if(!res.ok)throw Error(res.status);
  allRows=parseCSV(await res.text()).slice(1); render(document.getElementById("search").value);
 }catch(e){console.error(e);document.getElementById("status").textContent="Gagal memuat data. Klik Muat ulang.";}
}
document.getElementById("search").oninput=e=>render(e.target.value);
document.getElementById("refresh").onclick=loadData;
loadData(); setInterval(loadData,300000);
</script>
</body>
</html>
