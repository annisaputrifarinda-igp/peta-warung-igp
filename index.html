<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peta Warung IGP</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

<style>
html,body,#map{height:100%;margin:0}
body{font-family:Arial,sans-serif;overflow:hidden}

#searchBox{
  position:absolute;z-index:1000;top:12px;left:58px;
  width:min(650px,calc(100% - 85px));
}
#search{
  width:100%;box-sizing:border-box;padding:12px 14px;
  border:1px solid #ccc;border-radius:8px;
  font-size:15px;outline:none;background:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.18);
}
#suggestions{
  display:none;background:#fff;border:1px solid #ddd;
  border-top:0;border-radius:0 0 8px 8px;
  max-height:300px;overflow-y:auto;overflow-x:hidden;
  box-shadow:0 3px 12px rgba(0,0,0,.18);
}
.suggestion{
  padding:10px 12px;cursor:pointer;border-bottom:1px solid #eee;
}
.suggestion:hover,.suggestion.active{background:#f0f6ff}
.suggestion small{display:block;color:#666;margin-top:3px}

#controls{
  display:flex;gap:7px;flex-wrap:wrap;
  max-width:100%;margin-top:8px;
}
button,select{
  border:0;border-radius:7px;background:#fff;padding:9px 11px;
  box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer;font-size:14px;
}
button:hover{background:#f3f3f3}
#kabupaten{max-width:220px}

#status{
  position:absolute;z-index:1000;left:58px;bottom:14px;
  padding:8px 11px;border-radius:7px;background:rgba(255,255,255,.95);
  box-shadow:0 2px 8px rgba(0,0,0,.2);font-size:13px;
}
#nearbyPanel{
  position:absolute;z-index:1000;right:12px;top:12px;
  width:min(320px,calc(100% - 24px));max-height:55vh;overflow:auto;
  display:none;background:#fff;border-radius:9px;
  box-shadow:0 3px 15px rgba(0,0,0,.25);
}
#nearbyPanel h3{margin:0;padding:12px;border-bottom:1px solid #ddd}
.nearbyItem{padding:10px 12px;border-bottom:1px solid #eee;cursor:pointer}
.nearbyItem:hover{background:#f5f5f5}
.nearbyItem small{display:block;color:#666;margin-top:3px}
.closeNearby{float:right;background:none;box-shadow:none;padding:0;font-size:20px}

.legend{
  line-height:18px;color:#333;background:#fff;padding:8px 10px;
  border-radius:7px;box-shadow:0 2px 8px rgba(0,0,0,.2);
  max-height:220px;overflow:auto;max-width:220px;
}
.legend i{width:14px;height:14px;float:left;margin-right:7px;margin-top:2px;border-radius:50%}

@media(max-width:600px){
  #searchBox{
    left:58px;
    width:calc(100% - 72px);
  }
  #controls{
    gap:6px;
  }
  #controls button,#controls select{
    font-size:13px;
    padding:8px 9px;
  }
  #kabupaten{
    max-width:100%;
    flex:1 1 100%;
  }
  #nearbyPanel{top:auto;bottom:50px}
}
</style>
</head>

<body>
<div id="map"></div>

<div id="searchBox">
  <input id="search" autocomplete="off" placeholder="Cari nama warung / alamat / kabupaten...">
  <div id="suggestions"></div>

  <!-- Kontrol sengaja diletakkan setelah daftar saran,
       sehingga daftar saran tidak pernah menutupi tombol. -->
  <div id="controls">
    <select id="kabupaten">
      <option value="">🏘️ Semua Kabupaten / Kota</option>
    </select>
    <button id="locate">📍 Lokasi Saya</button>
    <button id="nearby">🔎 Warung Terdekat</button>
    <button id="refresh">↻ Muat ulang</button>
    <button id="satellite">🛰️ Satelit</button>
  </div>
</div>

<div id="status">Memuat data...</div>

<div id="nearbyPanel">
  <h3>🔎 Warung Terdekat <button class="closeNearby" onclick="closeNearby()">×</button></h3>
  <div id="nearbyList"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script>
const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQP1l3fVYi1dWu0g2UkLdpwcqosl7SUMGqDhibVGx6caqQwHKWWEx-ldWfLxrewHWlSiIm46Bv2uHIb/pub?output=csv";

const map = L.map("map", { preferCanvas:true }).setView([-4.8,105.4], 9);

const street = L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",
  {
    maxZoom:19,
    maxNativeZoom:19,
    updateWhenIdle:true,
    keepBuffer:3,
    attribution:
      '&copy; OpenStreetMap contributors &copy; CARTO'
  }
).addTo(map);

const satellite = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  {
    maxZoom:19,
    maxNativeZoom:19,
    updateWhenIdle:true,
    keepBuffer:3,
    attribution:"Tiles &copy; Esri"
  }
);

// Peta jalan OpenStreetMap: lebih jelas untuk jalan, nama tempat, dan batas wilayah.
street.on("tileerror",()=>{
  setTimeout(()=>street.redraw(),500);
});
satellite.on("tileerror",()=>{
  setTimeout(()=>satellite.redraw(),500);
});

const layer = L.markerClusterGroup({
  chunkedLoading:true,
  chunkInterval:80,
  chunkDelay:20,
  maxClusterRadius:55,
  disableClusteringAtZoom:16,
  spiderfyOnMaxZoom:true,
  showCoverageOnHover:false
});
map.addLayer(layer);

// Membantu tile menggambar ulang dengan benar setelah zoom/resize.
map.on("zoomend",()=>map.invalidateSize({pan:false}));
window.addEventListener("resize",()=>map.invalidateSize({pan:false}));

let allRows = [];
let visibleRows = [];
let userMarker = null;
let userCircle = null;
let colors = {};
let satelliteOn = false;
let lastRenderedFilter = "";

const status = document.getElementById("status");
const search = document.getElementById("search");
const suggestions = document.getElementById("suggestions");
const kabupatenSelect = document.getElementById("kabupaten");

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function normalize(s){
  return String(s ?? "").trim().toLowerCase();
}

function parseCSV(text){
  const rows=[];
  let row=[], cell="", quoted=false;

  for(let i=0;i<text.length;i++){
    const c=text[i], n=text[i+1];
    if(quoted){
      if(c === '"' && n === '"'){ cell+='"'; i++; }
      else if(c === '"') quoted=false;
      else cell+=c;
    }else{
      if(c === '"') quoted=true;
      else if(c === ','){ row.push(cell); cell=""; }
      else if(c === '\n'){
        row.push(cell); rows.push(row); row=[]; cell="";
      }else if(c !== '\r') cell+=c;
    }
  }
  row.push(cell);
  if(row.some(x=>x.trim()!=="")) rows.push(row);

  if(!rows.length) return [];
  const headers=rows[0].map(x=>normalize(x));
  return rows.slice(1).map(r=>{
    const o={};
    headers.forEach((h,i)=>o[h]=(r[i] ?? "").trim());

    // Samakan beberapa variasi nama kolom Google Sheets menjadi nama internal.
    const kab = o["kabupaten / kota"] || o["kabupaten/kota"] || o["kabupaten"] || o["kota"] || "";
    if(kab) o.kabupaten = kab;
    const kec = o["kecamatan"] || "";
    if(kec) o.kecamatan = kec;

    return o;
  });
}

function num(v){
  if(v===null || v===undefined || v==="") return NaN;
  let s=String(v).trim().replace(/\s/g,"");
  // Menangani data lama seperti -49,953,786 sebagai -4.9953786
  if((s.match(/,/g)||[]).length>1){
    const neg=s.startsWith("-") ? -1 : 1;
    s=s.replace(/-/g,"").replace(/,/g,"");
    if(s.length>1) s=s.slice(0,1)+"."+s.slice(1);
    return neg*parseFloat(s);
  }
  // Jika koma tunggal dipakai sebagai desimal
  if(s.includes(",") && !s.includes(".")) s=s.replace(",",".");
  return parseFloat(s);
}

function getCoord(r){
  let lat=num(r.latitude_benar);
  let lng=num(r.longitude_benar);
  if(!Number.isFinite(lat)) lat=num(r.latitude);
  if(!Number.isFinite(lng)) lng=num(r.longitude);
  return {lat,lng};
}

function colorFor(k){
  const key=k || "Tanpa Kabupaten";
  if(!colors[key]){
    const hue=(Object.keys(colors).length*47)%360;
    colors[key]=`hsl(${hue},70%,45%)`;
  }
  return colors[key];
}

function makeIcon(color){
  return L.divIcon({
    className:"",
    html:`<div style="
      width:22px;height:22px;border-radius:50% 50% 50% 0;
      background:${color};transform:rotate(-45deg);
      border:2px solid white;box-shadow:0 2px 5px rgba(0,0,0,.35);
      position:relative">
      <div style="width:7px;height:7px;border-radius:50%;background:white;
      position:absolute;left:7px;top:7px"></div>
    </div>`,
    iconSize:[26,26], iconAnchor:[13,26], popupAnchor:[0,-24]
  });
}

function popupHtml(r){
  const {lat,lng}=getCoord(r);
  const name=esc(r.name || "Warung");
  const kec=esc(r.kabupaten || "Tidak diisi");
  const desc=esc(r.description || "");
  const maps=`https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;

  return `
    <div style="min-width:220px;max-width:300px">
      <b style="font-size:16px">${name}</b>
      <div style="margin:6px 0"><b>Kabupaten:</b> ${kec}</div>
      ${desc ? `<div style="margin-bottom:8px">${desc}</div>` : ""}
      <a href="${maps}" target="_blank" rel="noopener"
         style="display:inline-block;background:#1a73e8;color:white;
         padding:8px 11px;border-radius:6px;text-decoration:none">
         🗺️ Lihat di Google Maps
      </a>
    </div>`;
}

function render(list, fit=false){
  layer.clearLayers();
  visibleRows=list;

  const markers=[];
  list.forEach(r=>{
    const {lat,lng}=getCoord(r);
    if(!Number.isFinite(lat)||!Number.isFinite(lng)) return;

    const kec=r.kabupaten || "";
    const marker=L.marker([lat,lng],{icon:makeIcon(colorFor(kec))});
    marker.bindPopup(popupHtml(r));
    marker._row=r;
    markers.push(marker);
  });

  layer.addLayers(markers);

  status.textContent=`Menampilkan ${markers.length.toLocaleString("id-ID")} warung`;

  if(fit && markers.length){
    const group=L.featureGroup(markers);
    map.fitBounds(group.getBounds().pad(0.12));
  }
}

function populateKabupaten(){
  const vals=[...new Set(allRows
    .map(r=>r.kabupaten)
    .filter(Boolean))]
    .sort((a,b)=>a.localeCompare(b,"id"));

  kabupatenSelect.innerHTML='<option value="">🏘️ Semua Kabupaten / Kota</option>';
  vals.forEach(v=>{
    const o=document.createElement("option");
    o.value=v; o.textContent=v;
    kabupatenSelect.appendChild(o);
  });
}

function applyFilter(fit=false){
  const selected=normalize(kabupatenSelect.value);
  const q=normalize(search.value);

  const filtered=allRows.filter(r=>{
    const kecOk=!selected || normalize(r.kabupaten)===selected;
    const text=[r.name,r.description,r.kabupaten].map(normalize).join(" ");
    const searchOk=!q || text.includes(q);
    return kecOk && searchOk;
  });

  render(filtered,fit);
  lastRenderedFilter=selected+"|"+q;
}

function showSuggestions(){
  const q=normalize(search.value);
  suggestions.innerHTML="";
  if(!q){ suggestions.style.display="none"; return; }

  const matches=allRows.filter(r=>{
    const text=[r.name,r.description,r.kabupaten].map(normalize).join(" ");
    return text.includes(q);
  }).slice(0,10);

  if(!matches.length){ suggestions.style.display="none"; return; }

  matches.forEach((r,i)=>{
    const d=document.createElement("div");
    d.className="suggestion";
    d.innerHTML=`<b>${esc(r.name || "Warung")}</b>
      <small>🏘️ ${esc(r.kabupaten || "Kabupaten belum diisi")}</small>`;
    d.onclick=()=>selectSuggestion(r);
    suggestions.appendChild(d);
  });
  suggestions.style.display="block";
}

function selectSuggestion(r){
  search.value=r.name || "";
  suggestions.style.display="none";

  if(r.kabupaten) kabupatenSelect.value=r.kabupaten;
  applyFilter(false);

  const {lat,lng}=getCoord(r);
  if(Number.isFinite(lat)&&Number.isFinite(lng)){
    map.setView([lat,lng],17);
    setTimeout(()=>{
      const marker=visibleRows.find(x=>x===r);
      if(marker){
        // Cari marker berdasarkan koordinat
        layer.eachLayer(m=>{
          if(m._row===r) m.openPopup();
        });
      }
    },250);
  }
}

search.addEventListener("input",()=>{
  showSuggestions();
  if(!search.value.trim()) applyFilter(false);
});

search.addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    const first=suggestions.querySelector(".suggestion");
    if(first) first.click();
    else applyFilter(true);
  }
});

document.addEventListener("click",e=>{
  if(!document.getElementById("searchBox").contains(e.target))
    suggestions.style.display="none";
});

kabupatenSelect.addEventListener("change",()=>applyFilter(true));

document.getElementById("refresh").onclick=loadData;

document.getElementById("satellite").onclick=()=>{
  satelliteOn=!satelliteOn;
  if(satelliteOn){
    map.removeLayer(street);
    satellite.addTo(map);
    document.getElementById("satellite").textContent="🗺️ Peta Jalan";
  }else{
    map.removeLayer(satellite);
    street.addTo(map);
    document.getElementById("satellite").textContent="🛰️ Satelit";
  }
};

document.getElementById("locate").onclick=()=>{
  if(!navigator.geolocation){
    alert("Browser tidak mendukung lokasi.");
    return;
  }

  status.textContent="Mencari lokasi Anda...";
  navigator.geolocation.getCurrentPosition(pos=>{
    const lat=pos.coords.latitude, lng=pos.coords.longitude;

    if(userMarker) map.removeLayer(userMarker);
    if(userCircle) map.removeLayer(userCircle);

    userMarker=L.marker([lat,lng]).addTo(map)
      .bindPopup("📍 Lokasi Anda").openPopup();

    userCircle=L.circle([lat,lng],{
      radius:pos.coords.accuracy || 50,
      color:"#1976d2",fillOpacity:.12
    }).addTo(map);

    map.setView([lat,lng],14);
    status.textContent="Lokasi Anda ditemukan.";
  },err=>{
    status.textContent="Lokasi tidak dapat diperoleh.";
    alert("Izinkan akses lokasi pada browser, lalu coba lagi.");
  },{enableHighAccuracy:true,timeout:10000});
};

document.getElementById("nearby").onclick=()=>{
  if(!userMarker){
    alert("Klik 📍 Lokasi Saya terlebih dahulu.");
    return;
  }

  const user=userMarker.getLatLng();
  const nearby=allRows.map(r=>{
    const c=getCoord(r);
    if(!Number.isFinite(c.lat)||!Number.isFinite(c.lng)) return null;
    const d=map.distance(user,[c.lat,c.lng]);
    return {...r,_distance:d};
  }).filter(Boolean).sort((a,b)=>a._distance-b._distance).slice(0,10);

  const list=document.getElementById("nearbyList");
  list.innerHTML="";

  nearby.forEach(r=>{
    const d=document.createElement("div");
    d.className="nearbyItem";
    const distance=r._distance<1000
      ? `${Math.round(r._distance)} m`
      : `${(r._distance/1000).toFixed(1)} km`;

    d.innerHTML=`<b>${esc(r.name||"Warung")}</b>
      <small>🏘️ ${esc(r.kabupaten||"Kabupaten belum diisi")} · 📏 ${distance}</small>`;

    d.onclick=()=>{
      const c=getCoord(r);
      map.setView([c.lat,c.lng],17);
      layer.eachLayer(m=>{
        if(m._row===r) m.openPopup();
      });
    };
    list.appendChild(d);
  });

  document.getElementById("nearbyPanel").style.display="block";
};

function closeNearby(){
  document.getElementById("nearbyPanel").style.display="none";
}

async function loadData(){
  status.textContent="Memuat data dari Google Sheets...";
  try{
    const url=CSV_URL+"&_="+Date.now();
    const res=await fetch(url,{cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);

    const text=await res.text();
    allRows=parseCSV(text).filter(r=>{
      const c=getCoord(r);
      return r.name && Number.isFinite(c.lat) && Number.isFinite(c.lng);
    });

    populateKabupaten();
    applyFilter(false);

    status.textContent=`Data siap · ${allRows.length.toLocaleString("id-ID")} warung`;
  }catch(err){
    console.error(err);
    status.textContent="Gagal memuat data.";
    alert("Data Google Sheets gagal dimuat. Pastikan spreadsheet sudah dipublikasikan ke web.");
  }
}

/* Legenda warna kabupaten */
const legend=L.control({position:"bottomright"});
legend.onAdd=function(){
  const div=L.DomUtil.create("div","legend");
  div.innerHTML="<b>🏘️ Kabupaten</b><br>";
  return div;
};
legend.addTo(map);

function updateLegend(){
  const el=document.querySelector(".legend");
  if(!el) return;
  const vals=[...new Set(allRows.map(r=>r.kabupaten).filter(Boolean))]
    .sort((a,b)=>a.localeCompare(b,"id"));

  el.innerHTML="<b>🏘️ Kabupaten</b><br>"+
    vals.map(k=>`<div><i style="background:${colorFor(k)}"></i>${esc(k)}</div>`).join("");
}

const oldPopulate=populateKabupaten;
populateKabupaten=function(){
  oldPopulate();
  updateLegend();
};

loadData();
</script>
</body>
</html>
